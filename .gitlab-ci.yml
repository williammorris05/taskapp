image: python:3.11

stages: [lint, test]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install -r requirements.txt
  - pip install pytest pytest-cov coverage

# --- Lint (PEP8/Flake8) ---
lint:
  stage: lint
  script:
    - flake8 .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- Tests + coverage (>=50%) ---
test:
  stage: test
  script:
    - python -m pytest tests --maxfail=1 --disable-warnings -q \
        --cov=src/app --cov-report=term-missing \
        --cov-report=xml:coverage.xml --cov-fail-under=50
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week