<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskApp Demo</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#172033;margin:0}main{max-width:950px;margin:48px auto;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}h1{font-size:40px}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{background:#2563eb;color:white;cursor:pointer}form{display:flex;gap:12px;flex-wrap:wrap}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #e2e8f0}</style>
<main><h1>TaskApp</h1><p>Plan your next task and explore the team's projects.</p><p>Local demo · New tasks stay in memory until the server restarts.</p><section><h2>Create a task</h2><form id="create"><input name="title" aria-label="Task title" placeholder="Task title" required maxlength="200"><input name="description" aria-label="Description" placeholder="Description"><select name="priority" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select><button>Add task</button></form><p id="message" role="status"></p></section><section><h2>Tasks</h2><table><thead><tr><th>Title</th><th>Priority</th><th>Status</th></tr></thead><tbody id="tasks"></tbody></table></section><section><h2>Projects</h2><ul id="projects"></ul></section></main>
<script>
async function read(path){const r=await fetch(path);if(!r.ok)throw Error('Unable to load '+path);return r.json()}
async function refresh(){const tasks=await read('/tasks');document.querySelector('#tasks').replaceChildren(...tasks.map(t=>{const row=document.createElement('tr');for(const value of [t.title,t.priority,t.status]){const cell=document.createElement('td');cell.textContent=value||'—';row.append(cell)}return row}));const result=await read('/projects');const projects=Array.isArray(result)?result:(result.Projects||[]);document.querySelector('#projects').replaceChildren(...projects.map(p=>{const li=document.createElement('li');li.textContent=p.projectTitle||p.title||p.projectId;return li}))}
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const message=document.querySelector('#message');try{const r=await fetch('/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to create task');e.target.reset();await refresh();message.textContent='Task added.'}catch(error){message.textContent=error.message}};refresh().catch(error=>document.querySelector('#message').textContent=error.message);
</script></html>
